name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # runs .ts directly, no build step
      - run: npm test
      - run: npx -y prettier@3 --check '{plugins,.claude-plugin}/**/*.{ts,tsx,json}'
      # typecheck is local only: it needs plugins/*/.claude-plugin/types, which
      # Claude Code writes when it loads the plugins with --plugin-dir.
